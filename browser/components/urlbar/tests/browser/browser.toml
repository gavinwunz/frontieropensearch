[DEFAULT]
tags = "urlbar"
support-files = [
  "dummy_page.html",
  "head.js",
  "head-common.js",
  # Shared fixtures fetched through absolute mochi.test URLs by urlbar tests
  # that were moved into sibling browser-*/ directories (bug 2048207). They
  # must stay installed here because those URLs are hardcoded to this path.
  "add_search_engine_0.xml",
  "add_search_engine_1.xml",
  "add_search_engine_2.xml",
  "add_search_engine_3.xml",
  "no_title.html",
  "print_postdata.sjs",
]
prefs = [
  "browser.bookmarks.testing.skipDefaultBookmarksImport=true",
  "browser.urlbar.trending.featureGate=false",
  "layout.css.attr.enabled=true",
  "screenshots.browser.component.enabled=true",
  "sidebar.revamp=false",
  # Frontier OpenSearch's command bar is the one entry surface, so the address
  # bar shows the origin and does not take typing, and accel+L, alt+D, accel+K
  # and accel+E open the command bar instead of focusing it. Every test here
  # types into that bar or presses one of those keys. They are the coverage
  # that keeps the address bar working for the pref that restores it, so they
  # run against a window where it is still an input. The window where it is
  # not is covered in browser/components/fos/tests/browser/.
  "browser.fos.commandBar.replacesAddressBar=false",
]

["browser_MLSuggest_integration.js"]
support-files = [
  "!/toolkit/components/ml/tests/browser/head.js",
]

["browser_aboutHomeLoading.js"]
skip-if = [
  "tsan", # Intermittently times out, see 1622698 (frequent on TSan).
]

["browser_autoOpen.js"]

["browser_blanking.js"]
support-files = ["file_blank_but_not_blank.html"]

