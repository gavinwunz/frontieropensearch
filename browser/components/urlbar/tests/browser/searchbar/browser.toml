[DEFAULT]
tags = "urlbar"
support-files = [
  "../head-common.js",
  "head.js",
]
prefs = [
  "browser.search.widget.new=true",
  # Frontier OpenSearch's command bar is the one entry surface, so the address
  # bar shows the origin and does not take typing, and accel+L, alt+D, accel+K
  # and accel+E open the command bar instead of focusing it. Every test here
  # types into that bar or presses one of those keys. They are the coverage
  # that keeps the address bar working for the pref that restores it, so they
  # run against a window where it is still an input. The window where it is
  # not is covered in browser/components/fos/tests/browser/.
  "browser.fos.commandBar.replacesAddressBar=false",
]

["browser_new_searchbar_init.js"]

["browser_resultsMenu.js"]

["browser_search.js"]

["browser_searchModeSwitcher.js"]

["browser_searchbarOverflow.js"]

["browser_searchbar_a11y.js"]

["browser_searchbar_actionLabels.js"]

["browser_searchbar_addEngine.js"]

["browser_searchbar_addEngineBadge.js"]

["browser_searchbar_context.js"]

["browser_searchbar_customizing_nobreakout.js"]

["browser_searchbar_dragdrop.js"]

["browser_searchbar_keyboard_navigation.js"]

["browser_searchbar_mouseNavigation.js"]

["browser_searchbar_queryContextCache.js"]

["browser_searchbar_telemetry.js"]

["browser_searchbar_widths.js"]

["browser_searchmode.js"]
