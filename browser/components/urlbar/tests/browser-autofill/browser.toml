[DEFAULT]
tags = "urlbar"
support-files = [
  "../browser/head-common.js",
  "head.js",
]

prefs = [
  # Frontier OpenSearch's command bar is the one entry surface, so the address
  # bar shows the origin and does not take typing, and accel+L, alt+D, accel+K
  # and accel+E open the command bar instead of focusing it. Every test here
  # types into that bar or presses one of those keys. They are the coverage
  # that keeps the address bar working for the pref that restores it, so they
  # run against a window where it is still an input. The window where it is
  # not is covered in browser/components/fos/tests/browser/.
  "browser.fos.commandBar.replacesAddressBar=false",
]

["browser_adaptive_origin_fallback.js"]

["browser_backspace_dismissal.js"]

["browser_backspace_dismissal_guards.js"]

["browser_backspace_dismissal_reintegration.js"]

["browser_backspaced.js"]

["browser_canonize.js"]
https_first_disabled = true

["browser_caretNotAtEnd.js"]

["browser_clear_properly_on_accent_char.js"]

["browser_firstResult.js"]

["browser_inputField_contextmenu_dismissal.js"]

["browser_inputField_contextmenu_dismissal_telemetry.js"]

["browser_inputField_contextmenu_reintegration.js"]

["browser_inputHistory.js"]
https_first_disabled = true
support-files = [
  "../browser/searchSuggestionEngine.xml",
  "../browser/searchSuggestionEngine.sjs",
]

["browser_inputHistory_autofill.js"]

["browser_inputHistory_emptystring.js"]

["browser_originToAdaptive.js"]

["browser_paste.js"]

["browser_placeholder.js"]

["browser_preserve.js"]

["browser_reintegration_telemetry.js"]

["browser_resultMenu_dismissal.js"]

["browser_trimURLs.js"]

["browser_typed.js"]

["browser_undo.js"]
