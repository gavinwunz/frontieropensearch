[DEFAULT]
tags = "urlbar"
support-files = [
  "../browser/head-common.js",
  "head.js",
]
prefs = [
  "browser.bookmarks.testing.skipDefaultBookmarksImport=true",
  "browser.urlbar.trending.featureGate=false",
  # Frontier OpenSearch's command bar is the one entry surface, so the address
  # bar shows the origin and does not take typing, and accel+L, alt+D, accel+K
  # and accel+E open the command bar instead of focusing it. Every test here
  # types into that bar or presses one of those keys. They are the coverage
  # that keeps the address bar working for the pref that restores it, so they
  # run against a window where it is still an input. The window where it is
  # not is covered in browser/components/fos/tests/browser/.
  "browser.fos.commandBar.replacesAddressBar=false",
]

["browser_alias_replacement.js"]
support-files = [
  "../browser/searchSuggestionEngine.xml",
  "../browser/searchSuggestionEngine.sjs",
]

["browser_autofill.js"]

["browser_clickLink.js"]
https_first_disabled = true
support-files = ["../browser/dummy_page.html"]

["browser_engineRemoval.js"]

["browser_excludeResults.js"]
skip-if = [
  "os == 'mac' && os_version == '10.15' && arch == 'x86_64' && opt", # Bug 1938142
]

["browser_heuristic.js"]
https_first_disabled = true

["browser_indicator.js"]
https_first_disabled = true
support-files = [
  "../browser/searchSuggestionEngine.xml",
  "../browser/searchSuggestionEngine.sjs",
]

["browser_indicator_clickthrough.js"]

["browser_localOneOffs_actionText.js"]
support-files = [
  "../browser/searchSuggestionEngine.xml",
  "../browser/searchSuggestionEngine.sjs",
]

["browser_newWindow.js"]

["browser_no_results.js"]

["browser_omnibox.js"]

["browser_oneOffButton.js"]

["browser_pickResult.js"]
https_first_disabled = true

["browser_preview.js"]

["browser_searchModeSwitcher_appProvidedEngines.js"]
