[DEFAULT]
tags = "urlbar"
support-files = [
  "../browser/head-common.js",
  "head.js",
]

prefs = [
  # Frontier OpenSearch's command bar is the one entry surface, so the address
  # bar shows the origin and does not take typing, and accel+L, alt+D, accel+K
  # and accel+E open the command bar instead of focusing it. Every test here
  # types into that bar or presses one of those keys. They are the coverage
  # that keeps the address bar working for the pref that restores it, so they
  # run against a window where it is still an input. The window where it is
  # not is covered in browser/components/fos/tests/browser/.
  "browser.fos.commandBar.replacesAddressBar=false",
]

["browser_a11y.js"]

["browser_breakout_state.js"]

["browser_formatValue.js"]
skip-if = [
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11'", # Bug 1968567
]

["browser_formatValue_detachedTab.js"]

["browser_formatValue_strikeout.js"]
support-files = ["mixed_active.html"]

["browser_hiddenFocus.js"]

["browser_overflow.js"]
skip-if = [
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11'", # Bug 1968567
]

["browser_overflow_resize.js"]

["browser_privateFeature.js"]

["browser_registrableDomainInView.js"]

["browser_searchTerms.js"]
tags = "persisted-search"
skip-if = [
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11' && opt", # Bug 1968567
]

["browser_searchTerms_autofill.js"]
