[DEFAULT]
tags = "urlbar"
support-files = [
  "head.js",
  "searchSuggestionEngine.xml",
  "searchSuggestionEngine.sjs",
  "subdialog.xhtml",
]
prefs = [
  "browser.bookmarks.testing.skipDefaultBookmarksImport=true",
  "layout.css.attr.enabled=true",
  # Frontier OpenSearch's command bar is the one entry surface, so the address
  # bar shows the origin and does not take typing, and accel+L, alt+D, accel+K
  # and accel+E open the command bar instead of focusing it. Every test here
  # types into that bar or presses one of those keys. They are the coverage
  # that keeps the address bar working for the pref that restores it, so they
  # run against a window where it is still an input. The window where it is
  # not is covered in browser/components/fos/tests/browser/.
  "browser.fos.commandBar.replacesAddressBar=false",
]

["browser_pickedSearchSuggestion.js"]

["browser_quicksuggest.js"]

["browser_quicksuggest_addons.js"]

["browser_quicksuggest_block.js"]

["browser_quicksuggest_configuration.js"]

["browser_quicksuggest_contextual_optin.js"]

["browser_quicksuggest_dynamicSuggestions.js"]

["browser_quicksuggest_indexes.js"]

["browser_quicksuggest_mdn.js"]

["browser_quicksuggest_merinoSessions.js"]

["browser_quicksuggest_ping_deletionRequest.js"]
tags = "search-telemetry"
skip-if = [
  "true", # Bug 2056936 - The `quick-suggest-deletion-request` ping is disabled
]

["browser_quicksuggest_ping_nullValues.js"]
tags = "search-telemetry"

["browser_quicksuggest_ping_offline.js"]
tags = "search-telemetry"

["browser_quicksuggest_ping_online.js"]
tags = "search-telemetry"

["browser_quicksuggest_realtime_flight_status.js"]

["browser_quicksuggest_realtime_market.js"]

["browser_quicksuggest_realtime_optin.js"]

["browser_quicksuggest_realtime_yelp.js"]

["browser_quicksuggest_sports.js"]
support-files = [
  "moz.png",
  "moz-flipped.png",
]

["browser_quicksuggest_yelp.js"]

["browser_telemetry_environment.js"]
tags = "search-telemetry"

["browser_telemetry_suggestMetrics.js"]
tags = "search-telemetry"
skip-if = [
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11'", # Bug 1971091
]

["browser_weather.js"]
