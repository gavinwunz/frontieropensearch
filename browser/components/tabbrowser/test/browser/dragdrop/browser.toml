[DEFAULT]
support-files = [
  "head.js"
]
prefs = [
  # Frontier OpenSearch does not draw the tab strip — the Field shows open
  # pages instead — and every test here drags one. They are the coverage that
  # keeps the strip working for the pref that restores it, so they run against
  # a window that has one.
  "browser.fos.field.replacesTabStrip=false",
]

["browser_drag_horizontal_overflow.js"]
skip-if = [
  "os == 'mac' && os_version == '15.30' && arch == 'aarch64' && opt", # Bug 2057860
]

["browser_drag_multiselected_splitview.js"]

["browser_drag_splitview.js"]

["browser_drag_tab_group_expand_on_drop.js"]

["browser_drag_tab_group_overflow.js"]

["browser_drag_to_pin.js"]

["browser_drop_link_splitview_unselected.js"]

["browser_drop_link_user_interaction.js"]

["browser_move_unpinned_not_overflowing.js"]

["browser_stale_drag_session.js"]
