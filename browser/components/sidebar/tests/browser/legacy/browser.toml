[DEFAULT]
prefs = [
  "sidebar.revamp=false",
  # Frontier OpenSearch replaces linear history with the trail rail, so the
  # gesture that opened the history sidebar opens the rail instead. These tests
  # press that key and expect the sidebar. They are the coverage that keeps it
  # working for the pref that restores it, so they run against a window where
  # it still answers. The window where it does not is covered in
  # browser/components/fos/tests/browser/.
  "browser.fos.trailRail.replacesHistorySidebar=false",
]

["browser_sidebar_adopt.js"]

["browser_sidebar_app_locale_changed.js"]

["browser_sidebar_keys.js"]

["browser_sidebar_move.js"]

["browser_sidebar_persist.js"]
skip-if = [
  "true", # Bug 1898613
]

["browser_sidebar_switcher.js"]
